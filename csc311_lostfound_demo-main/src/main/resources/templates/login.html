<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sign In - Campus Lost &amp; Found</title>
</head>
<body>
<h1>Sign In</h1>

<p th:if="${param.registered}">Account created. Please sign in.</p>
<p th:if="${param.error}" style="color: red;">Wrong username or password.</p>
<p th:if="${param.logout}">You have signed out.</p>

<form th:action="@{/login}" method="post">
    <div>
        <label for="username">Username</label>
        <input id="username" name="username" type="text" required autofocus>
    </div>

    <div>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" required>
    </div>

    <button type="submit">Sign in</button>
</form>

<p>Need an account? <a th:href="@{/register}">Register</a></p>
</body>
</html>
